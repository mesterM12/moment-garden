name: Test procedural garden

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check botany.js
          node --check bouquet-link.js
          node --check flower.js
          node --check petal-meshes.js
      - name: Test seeded generation and bouquet links
        run: node --test botany.test.cjs bouquet-link.test.cjs
