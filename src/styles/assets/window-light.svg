    <filter id="near" x="-35%" y="-35%" width="170%" height="170%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="far" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="17"/></filter>
    <path id="leaf" d="M0 0C13-27 48-34 73-32 58-9 31 5 0 0Z"/>
    <g id="spray" fill="#78654f">
      <path fill="none" d="M-24 300C36 273 69 216 106 174S183 105 215 37" stroke="#78654f" stroke-width="4"/>
      <use href="#leaf" transform="translate(30 260) rotate(-98) scale(1.45)"/><use href="#leaf" transform="translate(38 248) rotate(21) scale(1.45)"/>
      <use href="#leaf" transform="translate(69 208) rotate(-85) scale(1.35)"/><use href="#leaf" transform="translate(86 194) rotate(22) scale(1.3)"/>
      <use href="#leaf" transform="translate(118 163) rotate(-79) scale(1.17)"/><use href="#leaf" transform="translate(136 145) rotate(12) scale(1.18)"/>
      <use href="#leaf" transform="translate(162 118) rotate(-78)"/><use href="#leaf" transform="translate(177 100) rotate(5) scale(.95)"/>
      <use href="#leaf" transform="translate(193 78) rotate(-70) scale(.77)"/><use href="#leaf" transform="translate(202 64) rotate(-12) scale(.66)"/>
      <use href="#leaf" transform="translate(212 44) rotate(-56) scale(.78)"/>
    </g>
  </defs>
  <g filter="url(#far)" opacity=".17"><use href="#spray" transform="translate(1440 420) rotate(188) scale(2.0)"/></g>
  <g filter="url(#near)" opacity=".14"><use href="#spray" transform="translate(-85 570) rotate(24) scale(1.45)"/></g>
</svg>
